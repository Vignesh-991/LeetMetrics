<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>LeetMetrics</title>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <h1>LeetMetrics</h1>
      <p class="subtitle">Track your LeetCode problem-solving progress</p>

      <!-- Username Input -->
      <div class="input-container">
        <p>Enter your LeetCode username</p>
        <div class="user-input">
          <input type="text" id="input-field" placeholder="username" />
          <button id="Search">Search</button>
        </div>
      </div>

      <!-- Dashboard -->
      <div class="stats-container">
        <!-- Overview Statistics -->
        <div class="overview">
          <div class="stat-card">
            <span class="stat-value" id="total-solved"> -- </span>
            <span class="stat-label"> Problems Solved </span>
          </div>

          <div class="stat-card">
            <span class="stat-value" id="acceptance-rate"> -- </span>
            <span class="stat-label"> Acceptance Rate </span>
          </div>

          <div class="stat-card">
            <span class="stat-value" id="ranking"> -- </span>
            <span class="stat-label"> Ranking </span>
          </div>

          <div class="stat-card">
            <span class="stat-value" id="contribution"> -- </span>
            <span class="stat-label"> Contribution </span>
          </div>
        </div>

        <!-- Difficulty Progress -->
        <div class="section">
          <h2>Problem Solving Progress</h2>

          <div class="progress">
            <!-- Easy -->
            <div class="progress-item">
              <div class="easy-progress circle">
                <span id="easy-label"> -- </span>

                <p>Easy</p>
              </div>
            </div>

            <!-- Medium -->
            <div class="progress-item">
              <div class="medium-progress circle">
                <span id="medium-label"> -- </span>

                <p>Medium</p>
              </div>
            </div>

            <!-- Hard -->
            <div class="progress-item">
              <div class="hard-progress circle">
                <span id="hard-label"> -- </span>

                <p>Hard</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Topic Analysis -->
        <div class="section topic-section">
          <h2>Top Solved Topics</h2>

          <div id="topic-container">
            <!-- Topics will be dynamically generated by JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
